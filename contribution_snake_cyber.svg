<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="1100" height="220">
  <defs>
    <radialGradient id="snakeBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c1929"/>
      <stop offset="60%" stop-color="#060e17"/>
      <stop offset="100%" stop-color="#020509"/>
    </radialGradient>

    <linearGradient id="snakeNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes snakeCrawl {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes eatPulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 6px #00f6ff); }
      }
      @keyframes radarSweep {
        0% { transform: translateX(0); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateX(1050px); opacity: 0; }
      }
      .snake-path {
        stroke-dasharray: 120 1800;
        animation: snakeCrawl 12s linear infinite;
      }
      .snake-head {
        animation: eatPulse 1.2s ease-in-out infinite;
      }
      .sweep-line {
        animation: radarSweep 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="220" rx="18" fill="url(#snakeBg)" stroke="#1a3b5c" stroke-width="1.5"/>

