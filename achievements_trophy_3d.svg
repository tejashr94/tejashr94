        <g class="spin-ring1">
          <circle cx="132" cy="65" r="46" fill="none" stroke="#00f6ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 6"/>
          <circle cx="132" cy="19" r="3" fill="#00f6ff"/>
        </g>
        <g class="spin-ring1-rev">
          <circle cx="132" cy="65" r="38" fill="none" stroke="#7928ca" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="14 8"/>
        </g>
        <circle cx="132" cy="65" r="32" fill="#0c2038" stroke="#00f6ff" stroke-width="2" class="pulse-neon"/>
        
        <!-- AI Brain / Circuit Icon -->
        <path d="M120 52 Q132 44 144 52 Q153 65 144 75 Q132 84 120 75 Q111 65 120 52 Z" fill="none" stroke="#00f6ff" stroke-width="2"/>
        <circle cx="132" cy="63" r="5" fill="#00ff9d"/>
        <line x1="120" y1="63" x2="144" y2="63" stroke="#00f6ff" stroke-width="1.5"/>
        <line x1="132" y1="52" x2="132" y2="74" stroke="#00f6ff" stroke-width="1.5"/>
      </g>

      <text x="132" y="130" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
        Oracle Certified
      </text>
      <text x="132" y="150" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#00f6ff" text-anchor="middle">
        Agentic AI Associate
      </text>

      <text x="132" y="174" font-family="'Courier New', monospace" font-size="9" fill="#8cb1cc" text-anchor="middle">
        ISSUER: ORACLE UNIVERSITY
      </text>

      <!-- Details Box -->
      <g transform="translate(16, 190)">
        <rect width="233" height="72" rx="8" fill="#071322" stroke="#1c4063"/>
        <text x="10" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#b9d7ef">
          • Autonomous AI Agents &amp; LLM
        </text>
        <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="11" fill="#b9d7ef">
