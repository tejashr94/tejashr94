        </text>
        <text x="10" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#b9d7ef">
          • Enterprise AI architecture
        </text>
      </g>

      <!-- Verification Button Pill -->
      <g transform="translate(24, 280)">
        <rect width="217" height="30" rx="8" fill="#0b243b" stroke="#00f6ff" stroke-width="1"/>
        <text class="verify-btn" x="108" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#00f6ff" text-anchor="middle">
          ↗ VERIFY // SEP '26
        </text>
      </g>
    </g>
  </a>

