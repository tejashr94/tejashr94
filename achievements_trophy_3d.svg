<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="achBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1f33"/>
      <stop offset="60%" stop-color="#070d17"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffae00"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>

    <linearGradient id="cyberGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14283f" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081422" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="scanVault" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="achGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#00f6ff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Filters -->
    <filter id="achGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00f6ff" flood-opacity="0.12"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes spin3D {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin3DRev {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes goldPulse {
        0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px #ffd700); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #ffd700); }
      }
      @keyframes neonPulse {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #00f6ff); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #00f6ff); }
      }
      @keyframes laserScan {
        0% { transform: translateY(-200px); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(460px); opacity: 0; }
      }
      @keyframes cardFloat1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes cardFloat2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes cardFloat3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes cardFloat4 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

      .spin-ring1 { transform-origin: 132px 65px; animation: spin3D 14s linear infinite; }
      .spin-ring1-rev { transform-origin: 132px 65px; animation: spin3DRev 18s linear infinite; }
      .spin-ring2 { transform-origin: 132px 65px; animation: spin3D 16s linear infinite; }
      .spin-ring2-rev { transform-origin: 132px 65px; animation: spin3DRev 20s linear infinite; }
      .spin-ring3 { transform-origin: 132px 65px; animation: spin3D 15s linear infinite; }
      .spin-ring3-rev { transform-origin: 132px 65px; animation: spin3DRev 17s linear infinite; }
      .spin-ring4 { transform-origin: 135px 65px; animation: spin3D 19s linear infinite; }
      .spin-ring4-rev { transform-origin: 135px 65px; animation: spin3DRev 15s linear infinite; }

      .card-float-1 { animation: cardFloat1 5s ease-in-out infinite; cursor: pointer; }
      .card-float-2 { animation: cardFloat2 5.5s ease-in-out infinite; animation-delay: -1.5s; cursor: pointer; }
      .card-float-3 { animation: cardFloat3 6s ease-in-out infinite; animation-delay: -3s; cursor: pointer; }
      .card-float-4 { animation: cardFloat4 5.2s ease-in-out infinite; animation-delay: -2.2s; cursor: pointer; }
      
      .laser { animation: laserScan 4.5s ease-in-out infinite; }
      .pulse-gold { animation: goldPulse 2.5s ease-in-out infinite; }
      .pulse-neon { animation: neonPulse 2.5s ease-in-out infinite; }

      .interactive-card:hover rect:first-child { stroke-width: 2.5; filter: drop-shadow(0 0 16px #00f6ff); }
      .interactive-card:hover .verify-btn { fill: #00ff9d; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="22" fill="url(#achBg)" stroke="#1a3b5c" stroke-width="1.5"/>
  <rect width="1200" height="440" rx="22" fill="url(#achGrid)"/>

  <!-- Scanning Laser Bar -->
  <g class="laser">
    <rect x="0" y="0" width="1200" height="50" fill="url(#scanVault)"/>
    <line x1="20" y1="25" x2="1180" y2="25" stroke="#00f6ff" stroke-width="1.5" filter="url(#achGlow)"/>
  </g>

  <!-- Top System Ribbon -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="38" rx="10" fill="#081422" stroke="#ffd700" stroke-opacity="0.4"/>
    <circle cx="20" cy="19" r="5" fill="#ffd700" class="pulse-gold"/>
    <text x="36" y="24" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#ffd700" letter-spacing="2">
      HONORS_VAULT // INTERACTIVE VERIFIED CREDENTIALS &amp; MERIT
    </text>
    <text x="960" y="24" font-family="'Courier New', monospace" font-size="11" fill="#00ff9d" letter-spacing="1">
      ● CLICK TO VERIFY BADGES
    </text>
  </g>

  <!-- ==================== BADGE 1: ORACLE AGENTIC AI (CLICKABLE) ==================== -->
