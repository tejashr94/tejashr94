<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <radialGradient id="projBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="60%" stop-color="#050a12"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>

    <linearGradient id="cyberBorderP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14283f" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#07121f" stop-opacity="0.98"/>
    </linearGradient>

    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00f6ff" flood-opacity="0.16"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00ff9d); }
      }
      .card-1 { animation: floatCard1 5s ease-in-out infinite; cursor: pointer; }
      .card-2 { animation: floatCard2 6s ease-in-out infinite; animation-delay: -2s; cursor: pointer; }
      .card-3 { animation: floatCard3 5.5s ease-in-out infinite; animation-delay: -3.5s; cursor: pointer; }
      .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }
      .interactive-proj:hover rect:first-child { stroke-width: 2.5; filter: drop-shadow(0 0 16px #00f6ff); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" rx="24" fill="url(#projBg)" stroke="#1a3552" stroke-width="1.5"/>

  <!-- System Ribbon -->
  <g transform="translate(30, 22)">
    <rect width="1140" height="36" rx="8" fill="#081422" stroke="#00f6ff" stroke-opacity="0.25"/>
    <circle cx="20" cy="18" r="4" fill="#00f6ff" class="pulse-dot"/>
    <text x="34" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#00f6ff" letter-spacing="2">
      FEATURED_SYSTEM_ARCHITECTURES // INTERACTIVE &amp; DEPLOYED FLAGSHIPS
    </text>
    <text x="960" y="22" font-family="'Courier New', monospace" font-size="11" fill="#00ff9d" letter-spacing="1">
      ● CLICK CARD TO OPEN REPO
    </text>
  </g>

  <!-- ==================== PROJECT CARD 1: PlentyBridge (CLICKABLE) ==================== -->
  <a href="https://github.com/tejashr94" target="_blank" rel="noopener noreferrer">
    <g class="card-1 interactive-proj" transform="translate(30, 75)">
      <rect width="360" height="355" rx="18" fill="url(#cardGrad1)" stroke="#00f6ff" stroke-width="1.5" filter="url(#pShadow)"/>
      
      <!-- Top Badge & SDG -->
      <g transform="translate(20, 24)">
        <rect width="105" height="22" rx="6" fill="#00f6ff" fill-opacity="0.15" stroke="#00f6ff" stroke-width="1"/>
        <text x="52" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#00f6ff" text-anchor="middle">MERN + GIS</text>

        <rect x="235" y="0" width="85" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="277" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">SDG 2 &amp; 12</text>
      </g>

      <!-- Title -->
      <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#ffffff">PlentyBridge ↗</text>
      <text x="20" y="98" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#00f6ff">Surplus Food Recovery Platform</text>

      <!-- Description -->
      <g transform="translate(20, 120)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a4c2dc" width="320">
          <tspan x="0" dy="0">• Real-time surplus food redistribution</tspan>
          <tspan x="0" dy="18">  connecting food donors &amp; NGOs.</tspan>
          <tspan x="0" dy="24">• 10+ RESTful APIs with Socket.IO for</tspan>
          <tspan x="0" dy="18">  sub-millisecond live chat &amp; sync.</tspan>
          <tspan x="0" dy="24">• Leaflet geospatial mapping for nearby-food</tspan>
          <tspan x="0" dy="18">  discovery and zero hunger optimization.</tspan>
        </text>
      </g>

      <!-- Tech Badges -->
      <g transform="translate(20, 275)">
        <rect x="0" y="0" width="60" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="30" y="14" font-family="'Courier New', monospace" font-size="9" fill="#00f6ff" text-anchor="middle">Node</text>
        
        <rect x="66" y="0" width="65" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="98" y="14" font-family="'Courier New', monospace" font-size="9" fill="#00ff9d" text-anchor="middle">MongoDB</text>
        
        <rect x="137" y="0" width="70" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="172" y="14" font-family="'Courier New', monospace" font-size="9" fill="#c084fc" text-anchor="middle">Socket.IO</text>

        <rect x="213" y="0" width="58" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="242" y="14" font-family="'Courier New', monospace" font-size="9" fill="#ffd700" text-anchor="middle">Leaflet</text>

        <rect x="277" y="0" width="45" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="299" y="14" font-family="'Courier New', monospace" font-size="9" fill="#ffffff" text-anchor="middle">React</text>
      </g>

      <!-- Live Status -->
      <g transform="translate(20, 320)">
        <circle cx="6" cy="6" r="4" fill="#00ff9d" class="pulse-dot"/>
        <text x="18" y="10" font-family="'Courier New', monospace" font-size="10" fill="#00ff9d">DEPLOYED &amp; ACTIVE // AUG '26</text>
      </g>
    </g>
  </a>

  <!-- ==================== PROJECT CARD 2: SakhiShield (CLICKABLE) ==================== -->
  <a href="https://github.com/tejashr94" target="_blank" rel="noopener noreferrer">
    <g class="card-2 interactive-proj" transform="translate(420, 75)">
      <rect width="360" height="355" rx="18" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1.5" filter="url(#pShadow)"/>
      
      <!-- Top Badge -->
      <g transform="translate(20, 24)">
        <rect width="125" height="22" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
        <text x="62" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">KOTLIN SAFETY</text>

        <rect x="235" y="0" width="85" height="22" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
        <text x="277" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">ANDROID</text>
      </g>

      <!-- Title -->
      <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#ffffff">SakhiShield ↗</text>
      <text x="20" y="98" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#f472b6">Autonomous Safety &amp; SOS Architecture</text>

      <!-- Description -->
      <g transform="translate(20, 120)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a4c2dc" width="320">
          <tspan x="0" dy="0">• Native Android safety app featuring</tspan>
          <tspan x="0" dy="18">  5+ emergency assistance modules.</tspan>
          <tspan x="0" dy="24">• Automated SMS Manager instant triggers</tspan>
          <tspan x="0" dy="18">  for rapid SOS alert dispatch.</tspan>
          <tspan x="0" dy="24">• Dual Map Engine (Google Maps &amp; Leaflet)</tspan>
          <tspan x="0" dy="18">  for hyper-accurate location routing.</tspan>
        </text>
      </g>

      <!-- Tech Badges -->
      <g transform="translate(20, 275)">
        <rect x="0" y="0" width="60" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="30" y="14" font-family="'Courier New', monospace" font-size="9" fill="#f472b6" text-anchor="middle">Kotlin</text>
        
        <rect x="66" y="0" width="55" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="93" y="14" font-family="'Courier New', monospace" font-size="9" fill="#00f6ff" text-anchor="middle">SDK</text>
        
        <rect x="127" y="0" width="75" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="164" y="14" font-family="'Courier New', monospace" font-size="9" fill="#ffd700" text-anchor="middle">Firebase</text>

        <rect x="208" y="0" width="60" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="238" y="14" font-family="'Courier New', monospace" font-size="9" fill="#00ff9d" text-anchor="middle">SMS API</text>

        <rect x="274" y="0" width="48" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="298" y="14" font-family="'Courier New', monospace" font-size="9" fill="#c084fc" text-anchor="middle">Maps</text>
      </g>

      <!-- Live Status -->
      <g transform="translate(20, 320)">
        <circle cx="6" cy="6" r="4" fill="#f472b6" class="pulse-dot"/>
        <text x="18" y="10" font-family="'Courier New', monospace" font-size="10" fill="#f472b6">ACTIVE &amp; PRODUCTION // JUN '26</text>
      </g>
    </g>
  </a>

  <!-- ==================== PROJECT CARD 3: MILAP 21 (CLICKABLE) ==================== -->
  <a href="https://github.com/tejashr94" target="_blank" rel="noopener noreferrer">
    <g class="card-3 interactive-proj" transform="translate(810, 75)">
      <rect width="360" height="355" rx="18" fill="url(#cardGrad1)" stroke="#ffd700" stroke-width="1.5" filter="url(#pShadow)"/>
      
      <!-- Top Badge -->
      <g transform="translate(20, 24)">
        <rect width="135" height="22" rx="6" fill="#ffd700" fill-opacity="0.15" stroke="#ffd700" stroke-width="1"/>
        <text x="67" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#ffd700" text-anchor="middle">DEFENCE VETERANS</text>

        <rect x="235" y="0" width="85" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="277" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">ECHS/ARMY</text>
      </g>

      <!-- Title -->
      <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#ffffff">MILAP 21 ↗</text>
      <text x="20" y="98" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#ffd700">Indian Army Veterans Mobile Ecosystem</text>

      <!-- Description -->
      <g transform="translate(20, 120)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a4c2dc" width="320">
          <tspan x="0" dy="0">• Engineered mobile portal for Indian Army</tspan>
          <tspan x="0" dy="18">  Veterans to access critical services.</tspan>
          <tspan x="0" dy="24">• Streamlined Hospital bookings, Canteen</tspan>
          <tspan x="0" dy="18">  inventory, and ECHS healthcare workflows.</tspan>
          <tspan x="0" dy="24">• Built with robust Java, Kotlin, and JS</tspan>
          <tspan x="0" dy="18">  multi-tier integration.</tspan>
        </text>
      </g>

      <!-- Tech Badges -->
      <g transform="translate(20, 275)">
        <rect x="0" y="0" width="55" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="27" y="14" font-family="'Courier New', monospace" font-size="9" fill="#ffd700" text-anchor="middle">Java</text>
        
        <rect x="61" y="0" width="60" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="91" y="14" font-family="'Courier New', monospace" font-size="9" fill="#c084fc" text-anchor="middle">Kotlin</text>
        
        <rect x="127" y="0" width="80" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="167" y="14" font-family="'Courier New', monospace" font-size="9" fill="#00f6ff" text-anchor="middle">JavaScript</text>

        <rect x="213" y="0" width="55" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="240" y="14" font-family="'Courier New', monospace" font-size="9" fill="#00ff9d" text-anchor="middle">ECHS</text>

        <rect x="274" y="0" width="48" height="20" rx="4" fill="#0a1d30" stroke="#1e466b"/>
        <text x="298" y="14" font-family="'Courier New', monospace" font-size="9" fill="#ffffff" text-anchor="middle">Android</text>
      </g>

      <!-- Live Status -->
      <g transform="translate(20, 320)">
        <circle cx="6" cy="6" r="4" fill="#ffd700" class="pulse-dot"/>
        <text x="18" y="10" font-family="'Courier New', monospace" font-size="10" fill="#ffd700">CERTIFIED INITIATIVE // JAN '21</text>
      </g>
    </g>
  </a>
</svg>
